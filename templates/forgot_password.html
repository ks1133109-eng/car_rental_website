{% extends "base.html" %}
{% block content %}

<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
    
    <div style="background: var(--bg-card); padding: 40px; border-radius: 20px; border: 1px solid var(--border); box-shadow: var(--shadow); width: 100%; max-width: 450px; text-align: center;">
        
        <div style="width: 70px; height: 70px; background: rgba(37, 99, 235, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: var(--primary); font-size: 1.8rem;">
            <i class="fas fa-key"></i>
        </div>

        <h2 style="margin: 0; font-size: 1.8rem; color: var(--text-main); margin-bottom: 10px;">Forgot Password?</h2>
        <p style="color: var(--text-light); font-size: 0.95rem; margin-bottom: 30px; line-height: 1.5;">
            No worries! Enter your email address below and we will send you a secure link to reset it.
        </p>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div style="margin-bottom: 25px; text-align: left;">
                <label style="display: block; font-weight: 600; margin-bottom: 8px; color: var(--text-light); font-size: 0.85rem; letter-spacing: 0.5px;">EMAIL ADDRESS</label>
                <div style="position: relative;">
                    <i class="fas fa-envelope" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-light);"></i>
                    <input type="email" name="email" placeholder="name@example.com" required
                           style="width: 100%; padding: 14px 14px 14px 45px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-body); color: var(--text-main); outline: none; font-size: 1rem; transition: 0.3s;">
                </div>
            </div>

            <button type="submit" class="btn-login" style="width: 100%; padding: 14px; font-size: 1rem; margin-bottom: 20px;">
                Send Reset Link <i class="fas fa-paper-plane" style="margin-left: 8px;"></i>
            </button>
        </form>

        <a href="{{ url_for('auth.login') }}" style="color: var(--text-light); text-decoration: none; font-size: 0.9rem; font-weight: 600; transition: 0.2s;">
            <i class="fas fa-arrow-left" style="margin-right: 5px;"></i> Back to Login
        </a>
    </div>

</div>

<script>
    const input = document.querySelector('input');
    input.addEventListener('focus', () => {
        input.style.borderColor = 'var(--primary)';
        input.style.boxShadow = '0 0 0 3px rgba(37, 99, 235, 0.2)';
    });
    input.addEventListener('blur', () => {
        input.style.borderColor = 'var(--border)';
        input.style.boxShadow = 'none';
    });
</script>

{% endblock %}
