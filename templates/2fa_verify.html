{% extends "base.html" %}
{% block content %}
<div style="max-width: 400px; margin: 80px auto; padding: 40px; background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); text-align: center;">
    <h2 style="margin-bottom: 20px;">Two-Factor Authentication</h2>
    <p>Please enter the code from your authenticator app.</p>
    
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <input type="text" name="code" placeholder="000 000" required autofocus
               style="width: 100%; padding: 15px; margin: 20px 0; text-align: center; font-size: 1.5rem; letter-spacing: 8px; border-radius: 8px; border: 1px solid var(--border);">
        <button type="submit" class="btn-login" style="width: 100%;">Verify Login</button>
    </form>
</div>
{% endblock %}
