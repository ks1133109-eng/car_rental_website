{% set hide_nav = True %}
{% set hide_footer = True %}
{% extends "base.html" %}
{% block content %}
<div style="background: var(--bg-body); min-height: 100vh; padding: 40px 5%; display: flex; justify-content: center;">
    <div style="background: var(--bg-card); padding: 40px; border-radius: 16px; box-shadow: var(--shadow); border: 1px solid var(--border); width: 100%; max-width: 600px;">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 20px;">
            <h2 style="margin: 0; color: var(--text-main);">Manage User Access</h2>
            <a href="{{ url_for('admin.manage_users') }}" style="color: var(--text-light); text-decoration: none; font-weight: 600;"><i class="fas fa-times"></i> Cancel</a>
        </div>

        <div style="background: var(--input-bg); padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid var(--border);">
            <h3 style="margin: 0 0 5px 0; color: var(--text-main);">{{ user.name }}</h3>
            <p style="margin: 0; color: var(--text-light);">{{ user.email }}</p>
        </div>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            
            <div style="margin-bottom: 25px;">
                <label style="font-size: 0.85rem; font-weight: bold; color: var(--text-light); margin-bottom: 8px; display: block;">ACCOUNT STATUS</label>
                <select name="status" style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-body); color: var(--text-main);">
                    <option value="Active" {% if user.status == 'Active' %}selected{% endif %}>✅ Active (Normal Access)</option>
                    <option value="Suspicious" {% if user.status == 'Suspicious' %}selected{% endif %}>⚠️ Suspicious (Flagged)</option>
                    <option value="Banned" {% if user.status == 'Banned' %}selected{% endif %}>🚫 Banned (No Access)</option>
                </select>
                <small style="color: var(--text-light); display: block; margin-top: 5px;">Banned users will not be able to log in.</small>
            </div>

            <div style="margin-bottom: 35px;">
                <label style="font-size: 0.85rem; font-weight: bold; color: var(--text-light); margin-bottom: 8px; display: block;">USER ROLE</label>
                <select name="role" style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-body); color: var(--text-main);">
                    <option value="User" {% if user.role == 'User' %}selected{% endif %}>Customer (Can rent cars)</option>
                    <option value="Client" {% if user.role == 'Client' %}selected{% endif %}>Client (Can list cars)</option>
                    <option value="Admin" {% if user.role == 'Admin' %}selected{% endif %}>Admin (Full Access)</option>
                </select>
            </div>

            <button type="submit" class="btn-login" style="width: 100%; padding: 15px; font-size: 1.1rem; border-radius: 10px; background: var(--primary);">Apply Changes</button>
        </form>
    </div>
</div>
{% endblock %}
