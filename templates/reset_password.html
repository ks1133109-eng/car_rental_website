{% extends "base.html" %}
{% block content %}

<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
  <div style="background: var(--bg-card); padding: 40px; border-radius: 20px; border: 1px solid var(--border);
              box-shadow: var(--shadow); width: 100%; max-width: 450px; text-align: center;">

    <div style="width: 70px; height: 70px; background: rgba(37,99,235,0.1); border-radius: 50%;
                display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
                color: var(--primary); font-size: 1.8rem;">
      <i class="fas fa-lock-open"></i>
    </div>

    <h2 style="margin: 0 0 8px; color: var(--text-main);">Set New Password</h2>
    <p style="color: var(--text-light); margin-bottom: 30px;">Choose a strong password for your account.</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div style="background: rgba(239,68,68,0.1); border: 1px solid #ef4444; color: #ef4444;
                    padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem;">
          {{ messages[0] }}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" style="text-align: left;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

      <div style="margin-bottom: 18px;">
        <label style="display: block; font-weight: 600; margin-bottom: 8px;
                      color: var(--text-light); font-size: 0.85rem; letter-spacing: 0.5px;">
          NEW PASSWORD
        </label>
        <div style="position: relative;">
          <i class="fas fa-lock" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-light);"></i>
          <input type="password" name="password" id="password" placeholder="Min 8 characters" required
                 style="width: 100%; padding: 14px 14px 14px 44px; border-radius: 10px;
                        border: 1px solid var(--border); background: var(--bg-body);
                        color: var(--text-main); outline: none; font-size: 1rem; transition: 0.3s;">
        </div>
      </div>

      <div style="margin-bottom: 28px;">
        <label style="display: block; font-weight: 600; margin-bottom: 8px;
                      color: var(--text-light); font-size: 0.85rem; letter-spacing: 0.5px;">
          CONFIRM PASSWORD
        </label>
        <div style="position: relative;">
          <i class="fas fa-lock" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-light);"></i>
          <input type="password" name="confirm_password" id="confirm_password" placeholder="Repeat password" required
                 style="width: 100%; padding: 14px 14px 14px 44px; border-radius: 10px;
                        border: 1px solid var(--border); background: var(--bg-body);
                        color: var(--text-main); outline: none; font-size: 1rem; transition: 0.3s;">
        </div>
        <div id="matchMsg" style="font-size: 0.8rem; margin-top: 6px; display: none;"></div>
      </div>

      <button type="submit" class="btn-login" style="width: 100%; padding: 14px; font-size: 1rem;">
        Update Password <i class="fas fa-check-circle" style="margin-left: 8px;"></i>
      </button>
    </form>

    <a href="{{ url_for('auth.login') }}" style="display: inline-block; margin-top: 20px; color: var(--text-light);
       text-decoration: none; font-size: 0.9rem; font-weight: 600;">
      <i class="fas fa-arrow-left" style="margin-right: 5px;"></i> Back to Login
    </a>
  </div>
</div>

<script>
  // Real-time password match indicator
  const pw1 = document.getElementById('password');
  const pw2 = document.getElementById('confirm_password');
  const msg = document.getElementById('matchMsg');

  function checkMatch() {
    if (!pw2.value) { msg.style.display = 'none'; return; }
    if (pw1.value === pw2.value) {
      msg.style.display = 'block';
      msg.style.color = '#10b981';
      msg.innerHTML = '<i class="fas fa-check-circle"></i> Passwords match';
      pw2.style.borderColor = '#10b981';
    } else {
      msg.style.display = 'block';
      msg.style.color = '#ef4444';
      msg.innerHTML = '<i class="fas fa-times-circle"></i> Passwords do not match';
      pw2.style.borderColor = '#ef4444';
    }
  }

  pw1.addEventListener('input', checkMatch);
  pw2.addEventListener('input', checkMatch);

  // Focus glow effect
  [pw1, pw2].forEach(inp => {
    inp.addEventListener('focus', () => {
      inp.style.borderColor = 'var(--primary)';
      inp.style.boxShadow = '0 0 0 3px rgba(37,99,235,0.15)';
    });
    inp.addEventListener('blur', () => {
      if (!inp.value) {
        inp.style.borderColor = 'var(--border)';
        inp.style.boxShadow = 'none';
      }
    });
  });
</script>

{% endblock %}
